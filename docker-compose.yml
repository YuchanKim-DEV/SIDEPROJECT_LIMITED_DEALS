services:
  mysql:
    image: mysql:8.4.11
    container_name: limited-deals-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: limited_deals
      MYSQL_USER: admin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:8.8.4
    container_name: limited-deals-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:4.3.2
    container_name: limited-deals-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # 브로커와 컨트롤러를 한 노드에서 같이 돌리는 KRaft 모드(ZooKeeper 없음). 로컬 학습용 단일 노드다.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: 내 PC에서 접속(localhost:9092), DOCKER: 다른 컨테이너에서 접속(kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ---- 관측 도구 (6단계) ----
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: limited-deals-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.7.9
    container_name: limited-deals-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:13.0.12
    container_name: limited-deals-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 로컬 학습용: 로그인 없이 관리자 권한으로 연다. 외부에 열 때는 반드시 끈다
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  # ---- 서버 5개 (7, 8단계). 기본으로는 뜨지 않고, --profile apps를 줄 때만 컨테이너로 뜬다 ----
  # 먼저: ./gradlew bootJar && scripts/deploy/build-images.sh
  # 실행: docker compose --profile apps up -d   (scripts/run-local.sh로 띄운 서버와 포트가 같으니 하나만 쓴다)
  gateway:
    image: limited-deals/gateway:local
    profiles: [apps]
    ports: ["8000:8000"]
    environment:
      REDIS_HOST: redis
      QUEUE_SERVICE_URL: http://queue-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      JWT_SECRET: ${JWT_SECRET:-}         # 비어 있으면 로컬 개발용 키(경고 로그)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-} # 비어 있으면 관리자 로그인이 닫힌다
      LIMITED_DEALS_LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on: [redis, queue-service, order-service, notification-service, payment-service]

  queue-service:
    image: limited-deals/queue-service:local
    profiles: [apps]
    ports: ["8081:8081"]
    environment:
      REDIS_HOST: redis
      LIMITED_DEALS_LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on: [redis]

  order-service:
    image: limited-deals/order-service:local
    profiles: [apps]
    ports: ["8082:8082"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:29092
      QUEUE_SERVICE_URL: http://queue-service:8081
      ENTRY_TOKEN_REQUIRED: ${ENTRY_TOKEN_REQUIRED:-true}
      LIMITED_DEALS_LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on: [mysql, kafka, queue-service]
    restart: on-failure   # MySQL이 아직 준비 중이면 실패하고 다시 뜬다

  notification-service:
    image: limited-deals/notification-service:local
    profiles: [apps]
    ports: ["8083:8083"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:29092
      LIMITED_DEALS_LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on: [mysql, kafka]
    restart: on-failure

  payment-service:
    image: limited-deals/payment-service:local
    profiles: [apps]
    ports: ["8084:8084"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:29092
      LIMITED_DEALS_LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on: [mysql, kafka]
    restart: on-failure

volumes:
  mysql_data:
  redis_data:
  kafka_data:
