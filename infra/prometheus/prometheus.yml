# 서버 5개의 /actuator/prometheus를 5초마다 읽는다.
# 서버들은 내 PC에서 jar로 돌고 있어서, 컨테이너 안에서는 host.docker.internal로 접근한다.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: limited-deals
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8000   # gateway
          - host.docker.internal:8081   # queue-service
          - host.docker.internal:8082   # order-service
          - host.docker.internal:8083   # notification-service
          - host.docker.internal:8084   # payment-service
