apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: limited-deals
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: limited-deals/gateway:local
          imagePullPolicy: Never   # kind에 직접 넣은 이미지를 쓴다(scripts/deploy/k8s.sh)
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: limited-deals-config
            - secretRef:          # JWT_SECRET, ADMIN_PASSWORD (scripts/deploy/k8s.sh가 처음 한 번 무작위로 만든다)
                name: limited-deals-auth
          resources:
            requests:   # 스케줄러가 자리를 잡을 때와 HPA가 사용률을 계산할 때 기준
              cpu: 250m
              memory: 384Mi
            limits:     # 메모리를 넘으면 컨테이너가 재시작된다. CPU 한도는 두지 않는다(느려지기만 하고 지연이 커짐)
              memory: 640Mi
          startupProbe:     # 뜨는 동안(최대 5분, 노트북 한 대에서 여러 대가 동시에 뜨면 2분 가까이 걸렸다)은 아래 두 검사를 하지 않는다
            httpGet: { path: /actuator/health/liveness, port: 8000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:   # 실패하면 트래픽만 빼고 재시작하지 않는다
            httpGet: { path: /actuator/health/readiness, port: 8000 }
            periodSeconds: 5
          livenessProbe:    # 실패하면 재시작한다. 외부(DB, Redis) 상태는 보지 않는다(외부 장애로 전부 재시작되는 것 방지)
            httpGet: { path: /actuator/health/liveness, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: limited-deals
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000
