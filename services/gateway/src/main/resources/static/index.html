<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIMITED_DEALS 테스트 콘솔</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6b6b70; --line:#e2e2e6; --card:#fff; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --fg:#ececee; --muted:#9a9aa2; --line:#2b2c31; --card:#18191c; --ok:#3fb950; --warn:#d29922; --bad:#f85149; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:14px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:18px; margin:0 0 4px; } p.sub { margin:0 0 16px; color:var(--muted); }
  .grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
  h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; color:var(--muted); font-size:12px; margin-top:8px; }
  input { width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); }
  button { margin-top:10px; padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:var(--fg); color:var(--bg); cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  .big { font-size:28px; font-weight:700; font-variant-numeric: tabular-nums; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; max-height:220px; overflow:auto; font-size:12px; white-space:pre-wrap; }
  a { color:inherit; }
</style>
</head>
<body>
<h1>LIMITED_DEALS 테스트 콘솔</h1>
<p class="sub">온라인 오픈런을 직접 겪어 보는 화면. 지표와 로그는 <a href="http://localhost:3000" target="_blank">Grafana</a>에서 본다.</p>

<div class="grid">
  <section>
    <h2>① 한정판 상품 만들기</h2>
    <label>이름</label><input id="pname" value="한정판 스니커즈">
    <label>재고</label><input id="pstock" type="number" value="100">
    <button onclick="createProduct()">만들기</button>
    <label>상품 id</label><input id="pid" type="number" placeholder="만들면 자동으로 채워짐">
    <button onclick="refreshProduct()">재고 조회</button>
    <div>남은 재고 <span class="big" id="stock">-</span></div>
  </section>

  <section>
    <h2>② 줄 서기 (나)</h2>
    <label>내 사용자 id</label><input id="uid">
    <button onclick="enterQueue()">줄 서기</button>
    <div id="state" class="big">대기 전</div>
    <div id="detail" class="sub"></div>
    <button id="buy" onclick="buy()" disabled>구매하기</button>
  </section>

  <section>
    <h2>③ 몰려드는 사람들 (시뮬레이션)</h2>
    <label>가상 사용자 수</label><input id="simUsers" type="number" value="10000">
    <button onclick="simulate()">한꺼번에 줄 세우기</button>
    <div>대기 <span class="big" id="waiting">-</span> 명 · 입장 <span id="admitted">-</span> 명</div>
    <p class="sub">대기열 서버가 1초마다 정해진 인원(기본 100명)만 입장시킨다. 시뮬레이션 사용자는 순번만 차지하고 구매하지 않는다.</p>
  </section>
</div>

<section style="margin-top:12px">
  <h2>기록</h2>
  <pre id="log"></pre>
</section>

<script>
const $ = id => document.getElementById(id);
const log = msg => { $("log").textContent = new Date().toLocaleTimeString() + "  " + msg + "\n" + $("log").textContent; };
$("uid").value = "user-" + Math.random().toString(36).slice(2, 8);
let token = null, source = null, statsTimer = null;

async function call(method, url, body, headers = {}) {
  const res = await fetch(url, { method, headers: { "Content-Type": "application/json", ...headers }, body: body && JSON.stringify(body) });
  const text = await res.text();
  let data; try { data = JSON.parse(text); } catch { data = text; }
  log(`${method} ${url} → ${res.status} ${typeof data === "string" ? data : JSON.stringify(data)}`);
  return { status: res.status, data, headers: res.headers };
}

async function createProduct() {
  const r = await call("POST", "/api/products", { name: $("pname").value, price: 199000, stock: +$("pstock").value });
  if (r.status === 201) { $("pid").value = r.data.id; $("stock").textContent = r.data.stock; startStats(); }
}

async function refreshProduct() {
  const r = await call("GET", "/api/products/" + $("pid").value);
  if (r.status === 200) $("stock").textContent = r.data.stock;
}

function render(s) {
  if (s.state === "WAITING") {
    $("state").textContent = s.position.toLocaleString() + "번째";
    $("state").className = "big warn";
    $("detail").textContent = "전체 대기 " + s.waiting.toLocaleString() + "명";
  } else if (s.state === "ADMITTED") {
    token = s.token;
    $("state").textContent = "입장!";
    $("state").className = "big ok";
    $("detail").textContent = "입장권 유효 " + s.tokenTtlSeconds + "초";
    $("buy").disabled = false;
  } else {
    $("state").textContent = "줄에 없음";
    $("state").className = "big";
  }
}

async function enterQueue() {
  const pid = $("pid").value, uid = $("uid").value;
  if (!pid) return log("먼저 상품 id를 정하세요");
  const r = await call("POST", `/api/queue/${pid}/enter`, null, { "X-User-Id": uid });
  if (r.status !== 200) return;
  render(r.data);
  if (source) source.close();
  source = new EventSource(`/api/queue/${pid}/stream?userId=${encodeURIComponent(uid)}`);
  source.addEventListener("status", e => { const s = JSON.parse(e.data); render(s); if (s.state === "ADMITTED") source.close(); });
  startStats();
}

async function buy() {
  const r = await call("POST", "/api/orders", { productId: +$("pid").value, quantity: 1 },
    { "X-User-Id": $("uid").value, "X-Entry-Token": token || "", "Idempotency-Key": crypto.randomUUID() });
  if (r.status === 201) { $("state").textContent = "구매 완료"; $("buy").disabled = true; $("stock").textContent = r.data.remainingStock; }
  else if (r.status === 409) { $("state").textContent = "품절"; $("state").className = "big bad"; }
}

async function simulate() {
  const pid = $("pid").value;
  if (!pid) return log("먼저 상품 id를 정하세요");
  await call("POST", `/api/queue/${pid}/simulate?users=${+$("simUsers").value}`);
  startStats();
}

function startStats() {
  if (statsTimer) return;
  statsTimer = setInterval(async () => {
    const pid = $("pid").value; if (!pid) return;
    const r = await fetch(`/api/queue/${pid}/stats`).then(r => r.ok ? r.json() : null).catch(() => null);
    if (r) { $("waiting").textContent = r.waiting.toLocaleString(); $("admitted").textContent = r.admitted.toLocaleString(); }
  }, 1000);
}
</script>
</body>
</html>
