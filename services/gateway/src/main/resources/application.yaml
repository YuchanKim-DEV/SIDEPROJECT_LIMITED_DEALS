server:
  port: 8000   # 이 PC의 8080은 다른 프로젝트가 쓰고 있어서 8000을 쓴다
spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 1s
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000     # 뒤쪽 서버 연결 1초
            response-timeout: 5s      # 응답 5초 넘으면 504로 끊는다(무한 대기 방지)
          routes:
            - id: queue-service
              uri: ${QUEUE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/queue/**
              filters:
                # 사용자 한 명당 초당 20건, 순간 40건까지. 넘으면 429 Too Many Requests
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userKeyResolver}"
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/orders/**, /api/products/**
              filters:
                # 주문 서버 전체로 초당 500건, 순간 1000건까지. 대기열이 입장 인원을 조절하고, 이건 마지막 방어선이다
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 500
                    redis-rate-limiter.burstCapacity: 1000
                    key-resolver: "#{@globalKeyResolver}"
