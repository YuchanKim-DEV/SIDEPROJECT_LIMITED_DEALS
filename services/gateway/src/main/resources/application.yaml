server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: queue-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/queue/**
            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/orders/**
