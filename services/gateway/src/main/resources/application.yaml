server:
  port: 8000   # 이 PC의 8080은 다른 프로젝트가 쓰고 있어서 8000을 쓴다
spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 1s
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000     # 뒤쪽 서버 연결 1초
            response-timeout: 5s      # 응답 5초 넘으면 504로 끊는다(무한 대기 방지)
          routes:
            # SSE 순번 스트림은 오래 열려 있어서 서킷 브레이커의 시간 제한(3초)을 붙이지 않는다
            - id: queue-stream
              uri: ${QUEUE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/queue/*/stream
            - id: queue-service
              uri: ${QUEUE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/queue/**
              filters:
                # 사용자 한 명당 초당 20건, 순간 40건까지. 넘으면 429 Too Many Requests
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: queue-service
                    fallbackUri: forward:/fallback/queue-service
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/orders/**, /api/products/**
              filters:
                # 주문 서버 전체로 초당 500건, 순간 1000건까지. 대기열이 입장 인원을 조절하고, 이건 마지막 방어선이다
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 500
                    redis-rate-limiter.burstCapacity: 1000
                    key-resolver: "#{@globalKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: order-service
                    fallbackUri: forward:/fallback/order-service
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback/notification-service
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana에서 서버별로 나눠 보기 위한 표시
    distribution:
      percentiles-histogram:
        http.server.requests: true                # p95, p99 응답 시간을 계산할 수 있게 구간별로 센다
