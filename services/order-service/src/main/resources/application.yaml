server:
  port: 8082
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/limited_deals?serverTimezone=UTC
    username: admin
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 로컬 개발용: 엔티티를 보고 없는 테이블과 칸만 추가한다. 운영에서는 쓰지 않는다.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
