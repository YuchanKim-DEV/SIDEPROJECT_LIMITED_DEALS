server:
  port: 8082
  tomcat:
    mbeanregistry:
      enabled: true   # 바쁜 요청 처리 스레드 수를 지표로 보기 위해
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/limited_deals?serverTimezone=UTC
    username: admin
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 로컬 개발용: 엔티티를 보고 없는 테이블과 칸만 추가한다. 운영에서는 쓰지 않는다.
      ddl-auto: update
    show-sql: true
    # 요청이 끝날 때까지 DB 커넥션을 붙잡지 않게 끈다(기본은 켜짐). 트랜잭션이 끝나면 바로 돌려준다(실험 09)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  cloud:
    circuitbreaker:
      bulkhead:
        resilience4j:
          # Spring Cloud CircuitBreaker는 기본으로 "동시 호출 25개" 제한(벌크헤드)을 몰래 함께 건다.
          # 입장권 확인 호출이 동시에 25개를 넘으면 대기열 서버가 멀쩡해도 즉시 실패(503)한다(실험 06).
          # 느린 호출은 응답 시간 제한(500ms)과 회로가 이미 끊어 주므로 끈다.
          enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                 # 복제본까지 저장했다고 답할 때만 성공으로 본다
      properties:
        enable.idempotence: true   # 재전송해도 브로커에 같은 메시지가 두 번 쌓이지 않게
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
        max.block.ms: 3000         # 브로커가 없을 때 오래 붙잡혀 있지 않게
    consumer:   # 결제 결과(payment-events)를 받는다(8단계)
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
limited-deals:
  outbox:
    relay-enabled: true
    relay-interval-ms: 300
    topic: order-events
  order:
    entry-token:
      # true면 대기열 입장권(X-User-Id, X-Entry-Token)이 있어야 주문할 수 있다. 1·2단계 실험을 위해 기본은 false
      required: ${ENTRY_TOKEN_REQUIRED:false}
      queue-url: ${QUEUE_SERVICE_URL:http://localhost:8081}
      connect-timeout-ms: 300
      read-timeout-ms: 500
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana에서 서버별로 나눠 보기 위한 표시
    distribution:
      percentiles-histogram:
        http.server.requests: true                # p95, p99 응답 시간을 계산할 수 있게 구간별로 센다
